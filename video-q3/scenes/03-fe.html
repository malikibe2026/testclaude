<!doctype html>
<html lang="ms" class="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../ui.css">
<script src="../icons.js"></script>
<script src="../motion.js"></script>
<style>

.grid338 { --cs:calc(var(--u)*2.3); --cg:calc(var(--u)*1.2); display:grid; grid-template-columns:repeat(26, var(--cs)); gap:var(--cg); justify-content:center; }
.cell { width:var(--cs); height:var(--cs); border-radius:50%; background:#c3d0dc; }
.cell.ok { background:var(--accent); }
.cell.todo { background:var(--accent-2); }
.card { background:var(--bg-2); border-radius:calc(var(--u)*2.2); box-shadow:0 calc(var(--u)*.6) calc(var(--u)*3) rgba(27,58,92,.10); }
.warn { color:var(--warn-ink); }

.safe { align-content:center; gap:calc(var(--u)*4.5); }
.row { display:grid; grid-template-columns:calc(var(--u)*20) 1fr calc(var(--u)*27) calc(var(--u)*13); align-items:center; gap:calc(var(--u)*2); }
.who { font-size:var(--fs-sub); font-weight:800; letter-spacing:-.01em; }
.track { position:relative; height:calc(var(--u)*5.6); border-radius:calc(var(--u)*1.2); background:#dde6ee; overflow:hidden; }
.seg { position:absolute; top:0; bottom:0; left:0; }
.seg.ok { background:var(--accent); }
.seg.todo { background:var(--accent-2); }
.cnt { font-size:var(--fs-body); font-weight:700; }
.rest { font-size:var(--fs-body); font-weight:800; text-align:right; }

</style>
</head>
<body>
<div class="bg"></div>
<main class="stage"><div class="safe" style="padding-top:calc(var(--u)*10)">
<div class="row">
<span class="who m" style="--in:left; --t:0.5s">AFIF</span>
<div class="track"><div class="seg ok m" style="--in:grow-x; --t:0.6s; --in-dur:1.1s; --in-ease:var(--ease-out); transform-origin:left; width:100.000%"></div></div>
<span class="cnt m" style="--in:fade; --t:1.4s">113/113 berkod</span>
<span class="rest m accent" style="--in:fade; --t:1.5s">0 baki</span>
</div><div class="row">
<span class="who m" style="--in:left; --t:0.95s">ELIYANA</span>
<div class="track"><div class="seg ok m" style="--in:grow-x; --t:1.05s; --in-dur:1.1s; --in-ease:var(--ease-out); transform-origin:left; width:99.107%"></div><div class="seg todo m" style="--in:fade; --t:1.95s; left:99.107%; width:0.893%"></div></div>
<span class="cnt m" style="--in:fade; --t:1.85s">111/112 berkod</span>
<span class="rest m warn" style="--in:fade; --t:1.95s">1 baki</span>
</div><div class="row">
<span class="who m" style="--in:left; --t:1.4s">IZAT</span>
<div class="track"><div class="seg ok m" style="--in:grow-x; --t:1.5s; --in-dur:1.1s; --in-ease:var(--ease-out); transform-origin:left; width:93.805%"></div><div class="seg todo m" style="--in:fade; --t:2.4s; left:93.805%; width:6.195%"></div></div>
<span class="cnt m" style="--in:fade; --t:2.3s">106/113 berkod</span>
<span class="rest m warn" style="--in:fade; --t:2.4s">7 baki</span>
</div>
</div></main>
<header class="hud"><div class="safe" style="align-content:start; justify-items:start; padding-top:calc(var(--u)*3)">
<p class="kicker m" style="--in:fade; --t:-0.2s"><b>01</b>Mengikut FE</p>
<h1 class="title m" data-headline style="--in:rise; --t:-0.2s; max-width:none">Kemajuan mengikut FE</h1>
</div></header>
</body>
</html>
